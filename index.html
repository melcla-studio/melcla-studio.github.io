<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melcla Studio</title>
  <meta name="description" content="Melcla Studio: estúdio de produtos digitais, Brasil.">
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecece6; --muted: #9a9a93; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 72px 16px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Melcla Studio</h1>
    <p class="muted">Estúdio de produtos digitais · Brasil</p>
    <p>Criamos produtos digitais pequenos e úteis.</p>
    <p>Em desenvolvimento: um assistente de acompanhamento por WhatsApp para pacientes de consultórios de nutrição, sempre sob supervisão da nutricionista responsável.</p>
  </main>
</body>
</html>
